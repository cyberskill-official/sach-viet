services:
  web:
    build:
      context: ./web
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.docker
    environment:
      DATABASE_PATH: /data/sachviet.sqlite
    volumes:
      - sachviet-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  sachviet-data:
