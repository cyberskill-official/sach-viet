name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: app/web

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sachviet
          POSTGRES_PASSWORD: sachviet
          POSTGRES_DB: sachviet
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U sachviet -d sachviet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://sachviet:sachviet@127.0.0.1:54329/sachviet

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Check governance gates
        working-directory: .
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          # New-branch first push sets `before` to the zero SHA. Comparing against
          # the root commit falsely requires HITL verdicts for all historical
          # task transitions. Prefer merge-base with origin/main, then HEAD~1.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              BASE_SHA="$(git merge-base HEAD origin/main)"
            elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse HEAD~1)"
            else
              BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi
          node app/web/scripts/require-hitl-verdict.mjs --base "$BASE_SHA"
          node app/web/scripts/check-cyberos-install.mjs --if-present

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Migrate
        run: npm run migrate

      - name: Test
        run: npm test

      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build
